<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>위험 신호 카드 게임</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gothic+A1:wght@500;700;800&display=swap">
<style>
/* Layout: sky backdrop → one white "line" board with 12 slots → card tray below. Single bright theme by choice (classroom tablet). */
:root{
  color-scheme: light;
  --sky1:#e3f1fb; --sky2:#a9cfeb;
  --paper:#ffffff; --ink:#1d2d57; --ink2:#55607a;
  --slot:#f5f9ff; --slotline:#c4dafb;
  --hot:#e0584a; --hotbg:#fcecea;
  --ok:#2f9e6b; --gold:#f2b632;
  --display:"Jua","Gothic A1",system-ui,sans-serif;
  --body:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --r:14px;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;font-family:var(--body);color:var(--ink);
  background:linear-gradient(135deg,var(--sky1),var(--sky2)) fixed var(--sky2);
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.wrap{max-width:1400px;margin:0 auto;padding-block:clamp(10px,2vh,22px) 28px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:clamp(10px,1.6vh,16px)}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:400;font-size:clamp(22px,2.6vw,34px);margin:0;letter-spacing:.5px;text-wrap:balance}
.pill{font-family:var(--display);font-size:clamp(14px,1.4vw,18px);background:var(--paper);border:2px solid var(--slotline);
  border-radius:999px;padding:6px 14px;display:flex;gap:8px;align-items:center;font-variant-numeric:tabular-nums}
.pill b{color:var(--hot);font-weight:400}
.spacer{flex:1}
button{font-family:var(--display);font-size:clamp(15px,1.4vw,19px);border:0;border-radius:12px;padding:10px 16px;cursor:pointer;color:var(--ink);background:var(--paper);
  box-shadow:0 3px 0 rgba(29,45,87,.18);transition:transform .1s}
button:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(29,45,87,.18)}
button:focus-visible,.card:focus-visible,.slot:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
button.primary{background:var(--ink);color:#fff}
button.primary:disabled{background:#b9c3d6;color:#eef2f8;cursor:not-allowed;box-shadow:none}
.icon-btn{padding:10px 12px}

.board{background:var(--paper);border-radius:20px;padding:clamp(12px,2vw,24px);box-shadow:0 6px 24px rgba(29,45,87,.12);border:1px solid #d9e7f7}
.board h2,.tray h2{font-family:var(--display);font-weight:400;font-size:clamp(16px,1.6vw,21px);margin:0 0 10px;display:flex;align-items:center;gap:8px}
.ends{display:flex;justify-content:space-between;font-family:var(--display);font-size:13px;color:var(--ink2);margin-bottom:6px}
.line{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:clamp(4px,1vw,14px);padding-bottom:16px}
.slot{position:relative;aspect-ratio:3/4.1;border:2px dashed var(--slotline);background:var(--slot);border-radius:12px;
  display:flex;align-items:center;justify-content:center;transition:background .15s,border-color .15s,transform .15s}
.slot .pos{position:absolute;top:4px;left:6px;font-size:11px;font-weight:800;color:#9fb3d3;font-variant-numeric:tabular-nums}
.slot .hint{font-family:var(--display);font-size:clamp(11px,1vw,14px);color:#a4b4cf}
.slot.over{background:#e4f0ff;border-color:var(--ink);border-style:solid;transform:scale(1.04)}
.slot.filled{border:0;background:transparent}
.slot.gone{border-style:dotted;opacity:.45}
.slot.gone .hint{font-size:11px}
.msg{text-align:center;font-family:var(--display);font-size:clamp(15px,1.5vw,20px);margin:14px 0 2px;line-height:1.55;min-height:3.1em;text-wrap:balance}
.msg .red{color:var(--hot)}

/* cards */
.card{--c:#999;position:relative;border-radius:12px;background:color-mix(in srgb,var(--c) 14%,#fff);border:2.5px solid color-mix(in srgb,var(--c) 70%,#fff);
  display:flex;flex-direction:column;align-items:center;touch-action:none;cursor:grab;overflow:hidden}
.card .no{position:absolute;top:5px;left:5px;width:22px;height:22px;border-radius:50%;background:var(--c);color:#fff;font:800 12px/22px var(--body);text-align:center}
.card .ttl{font-family:var(--display);width:100%;text-align:center;background:color-mix(in srgb,var(--c) 45%,#fff);line-height:1.2;text-wrap:balance}
.card img{display:block;mix-blend-mode:multiply;object-fit:contain;pointer-events:none;-webkit-user-drag:none}
.card .ds{font-weight:700;text-align:center;line-height:1.35;color:var(--ink);text-wrap:balance}
/* small card in a slot */
.slot .card{position:absolute;inset:0;padding:4px 3px 4px}
.slot .card .no{width:18px;height:18px;font-size:10px;line-height:18px;top:3px;left:3px}
.slot .card .ttl{font-size:clamp(10px,1.4vw,17px);padding:22px 2px 4px;background:none;flex:1;display:flex;align-items:flex-end;justify-content:center;order:2}
.slot .card img{width:92%;height:52%;order:1;margin-top:18px}
.slot .card .ds{display:none}
/* states in remove phase */
.slot.filled .card{cursor:pointer;filter:saturate(.6);opacity:.85}
.slot.edge .card{filter:none;opacity:1;cursor:pointer;animation:breathe 1.6s ease-in-out infinite}
.slot .tag{position:absolute;left:50%;bottom:-11px;transform:translateX(-50%);white-space:nowrap;font-family:var(--display);font-size:clamp(10px,.9vw,13px);
  padding:2px 8px;border-radius:999px;background:#eef3fb;color:var(--ink2);z-index:2;border:1.5px solid var(--slotline)}
.slot.edge .tag{background:var(--hotbg);color:var(--hot);border-color:var(--hot)}
.slot.edge{outline:3px solid var(--hot);outline-offset:3px;border-radius:12px}
@keyframes breathe{50%{transform:translateY(-4px)}}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

.tray{background:rgba(255,255,255,.55);border-radius:20px;padding:clamp(12px,1.8vw,20px);border:2px dashed rgba(255,255,255,.9);transition:background .15s}
.tray.over{background:rgba(255,255,255,.85)}
.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:clamp(8px,1vw,14px)}
.grid .card{padding-bottom:8px;min-height:100%}
.grid .card .ttl{font-size:clamp(14px,1.45vw,19px);padding:7px 4px 6px 24px}
.grid .card img{width:84%;aspect-ratio:224/111;margin:6px 0 4px}
.grid .card .ds{font-size:clamp(11px,1vw,13px);padding:0 6px}
.card.sel{box-shadow:0 0 0 4px var(--ink);transform:translateY(-3px)}
.card.lift{opacity:.25}
.empty{grid-column:1/-1;text-align:center;font-family:var(--display);color:var(--ink2);padding:18px 0;font-size:17px}
.shelf .card{cursor:default}
.shelf .card .ds{display:none}
.ghost{position:fixed;z-index:50;pointer-events:none;transform:translate(-50%,-50%) rotate(-4deg) scale(1.05);box-shadow:0 14px 30px rgba(29,45,87,.3);width:150px}
.ghost .ttl{font-size:16px;padding:6px 4px 5px 24px}
.ghost img{width:84%;margin:6px 0}
.ghost .ds{font-size:11px;padding:0 6px 8px}

/* pop modal */
.veil{position:fixed;inset:0;z-index:60;background:rgba(29,45,87,.45);display:flex;align-items:center;justify-content:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow:auto}
.big{width:min(360px,80vw);padding-bottom:18px;animation:pop .55s cubic-bezier(.2,1.6,.4,1) both;box-shadow:0 20px 50px rgba(0,0,0,.25);cursor:default}
.big .no{width:34px;height:34px;font-size:17px;line-height:34px;top:9px;left:9px}
.big .ttl{font-size:clamp(24px,3vw,32px);padding:12px 8px 10px 46px}
.big img{width:80%;margin:16px 0 10px}
.big .ds{font-size:clamp(16px,1.8vw,20px);padding:0 16px 14px}
.big button{margin-top:4px}
.boing{font-family:var(--display);color:#fff;font-size:clamp(26px,3.5vw,40px);text-shadow:0 3px 0 rgba(0,0,0,.18);margin-bottom:10px;animation:pop .5s both}
.modal-in{display:flex;flex-direction:column;align-items:center}
@keyframes pop{0%{transform:scale(.2);opacity:0}100%{transform:scale(1);opacity:1}}

/* finale */
.finale{flex-direction:column;background:rgba(29,45,87,.6)}
.finale h3{font-family:var(--display);font-weight:400;color:#fff;font-size:clamp(30px,5vw,58px);margin:0;text-shadow:0 4px 0 rgba(0,0,0,.2);animation:pop .6s cubic-bezier(.2,1.6,.4,1) both;text-align:center}
.finale p{color:#eaf2ff;font-family:var(--display);font-size:clamp(16px,2vw,22px);margin:6px 0 16px;text-align:center}
.fgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;width:min(1100px,100%)}
.fgrid .card{animation:pop .5s cubic-bezier(.2,1.7,.4,1) both;cursor:default;padding-bottom:6px}
.fgrid .card .ttl{font-size:clamp(12px,1.3vw,17px);padding:6px 4px 5px 22px}
.fgrid .card img{width:80%;aspect-ratio:224/111;margin:5px 0 2px}
.fgrid .card .ds{display:none}
.finale .actions{margin-top:18px;display:flex;gap:10px}
canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:70}

@media (max-width:1000px){ .grid{grid-template-columns:repeat(4,minmax(0,1fr))} .fgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:560px){ .slot .card .ttl{font-size:9px;padding-top:16px} .slot .card .no{display:none} .grid,.fgrid{grid-template-columns:repeat(3,minmax(0,1fr))} .ghost{width:120px} }
@media (prefers-reduced-motion:reduce){ *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important} }
</style>
<style>.shelfbox{background:rgba(255,255,255,.4);border-radius:20px;padding:clamp(12px,1.8vw,20px)}.shelfbox h2{font-family:var(--display);font-weight:400;font-size:clamp(16px,1.6vw,21px);margin:0 0 10px}.shelfbox .card{cursor:default}.shelfbox .card .ds{display:none}.slot.gone{border-style:dashed;opacity:1}</style>
<style>.slot .card.burst{animation:burst .42s ease-in forwards;z-index:5}@keyframes burst{0%{transform:scale(1)}35%{transform:scale(1.25) rotate(-6deg);filter:brightness(1.15)}100%{transform:scale(.1) rotate(10deg);opacity:0}}</style>
</head>
<body>
<div class="wrap" id="app">
  <header>
    <h1>위험 신호 카드 게임</h1>
    <div class="pill" id="status"></div>
    <div class="spacer"></div>
    <button class="icon-btn" id="sound" aria-pressed="true" title="소리 켜기/끄기">🔊 소리</button>
    <button id="reset">처음부터</button>
  </header>

  <section class="board" id="board">
    <h2 id="boardTitle"></h2>
    <div class="ends"><span>◀ 맨 앞</span><span>맨 뒤 ▶</span></div>
    <div class="line" id="line"></div>
    <div class="msg" id="msg"></div>
    <div style="display:flex;justify-content:center"><button class="primary" id="go" disabled>시작</button></div>
  </section>

  <section class="tray" id="tray">
    <h2 id="trayTitle">남은 카드</h2>
    <div class="grid" id="grid"></div>
  </section>
</div>
<canvas id="fx"></canvas>

function fresh(){ return {phase:"place",slots:Array(N).fill(null),tray:CARDS.map(c=>c.id),removed:[],sel:null}; }
let soundOn=true;
try{ if(localStorage.getItem("rs-sound")==="off") soundOn=false; }catch(e){}

function cardHTML(c){
  return `<div class="card" style="--c:${c.c}" data-id="${c.id}" tabindex="0" role="button" aria-label="${c.id+1}번 ${c.t}: ${c.d}">
    <span class="no">${c.id+1}</span><div class="ttl">${c.t}</div><img src="${c.img}" alt=""><div class="ds">${c.d}</div></div>`;
}
function ends(){
  let f=S.slots.findIndex(v=>v!==null), b=-1;
  for(let i=N-1;i>=0;i--) if(S.slots[i]!==null){b=i;break;}
  return [f,b];
}
function render(msg){
  const removing=S.phase!=="place";
  document.getElementById("app").classList.toggle("removing",removing);
  const [f,b]=ends();
  lineEl.innerHTML=S.slots.map((id,i)=>{
    const edge=removing && id!==null && (i===f||i===b);
    let inner = id===null ? `<span class="pos">${i+1}</span><span class="hint">${removing?"":"빈칸"}</span>` : cardHTML(CARDS[id]);
    if(removing && id!==null) inner+=`<span class="tag">${edge?"제거 가능":"대기"}</span>`;
    return `<div class="slot ${id!==null?"filled":""} ${edge?"edge":""} ${removing&&id===null?"gone":""}" data-slot="${i}">${inner}</div>`;
  }).join("");
  const placed=S.slots.filter(v=>v!==null).length;
  if(!removing){
    $("#status").innerHTML=`놓은 카드 <b>${placed}</b>/${N}`;
    $("#boardTitle").textContent="① 카드를 끌어서 빈칸에 놓아 보세요";
    goBtn.hidden=false; goBtn.disabled=placed<N;
    goBtn.textContent=placed<N?`빈칸을 모두 채우면 시작할 수 있어요 (${placed}/${N})`:"시작 ▶";
  }else{
    $("#status").innerHTML=`남은 카드 <b>${placed}</b>/${N}`;
    $("#boardTitle").textContent="② 맨 앞이나 맨 뒤 카드만 뺄 수 있어요";
    goBtn.hidden=true;
  }
  trayEl.style.opacity=removing?".5":"";
  trayEl.style.pointerEvents=removing?"none":"";
  gridEl.innerHTML=S.tray.length?S.tray.map(id=>cardHTML(CARDS[id])).join(""):`<div class="empty">남은 카드가 없어요.</div>`;
  if(S.sel!==null){ const el=gridEl.querySelector(`[data-id="${S.sel}"]`); if(el) el.classList.add("sel"); }
  if(msg!==undefined) msgEl.innerHTML=msg;
}

/* ---------- place phase: drag & tap ---------- */
let drag=null;
document.addEventListener("pointerdown",e=>{
  if(S.phase!=="place") return;
  const card=e.target.closest(".card"); if(!card||card.closest(".veil")) return;
  const sl=card.closest(".slot");
  drag={id:+card.dataset.id,from:sl?{slot:+sl.dataset.slot}:{tray:true},x0:e.clientX,y0:e.clientY,el:card,ghost:null,pid:e.pointerId};
});
document.addEventListener("pointermove",e=>{
  if(!drag||e.pointerId!==drag.pid) return;
  if(!drag.ghost){
    if(Math.hypot(e.clientX-drag.x0,e.clientY-drag.y0)<8) return;
    const g=document.createElement("div"); g.innerHTML=cardHTML(CARDS[drag.id]); drag.ghost=g.firstElementChild;
    drag.ghost.classList.add("ghost"); document.body.appendChild(drag.ghost); drag.el.classList.add("lift");
  }
  e.preventDefault();
  drag.ghost.style.left=e.clientX+"px"; drag.ghost.style.top=e.clientY+"px";
  document.querySelectorAll(".slot.over").forEach(s=>s.classList.remove("over")); trayEl.classList.remove("over");
  const t=document.elementFromPoint(e.clientX,e.clientY);
  const s=t&&t.closest(".slot"); if(s) s.classList.add("over");
  else if(t&&t.closest("#tray")&&drag.from.slot!==undefined) trayEl.classList.add("over");
  autoScroll(e.clientY);
},{passive:false});
document.addEventListener("pointerup",e=>finish(e));
document.addEventListener("pointercancel",e=>finish(e,true));
function finish(e,cancel){
  if(!drag||e.pointerId!==drag.pid) return;
  const d=drag; drag=null;
  document.querySelectorAll(".slot.over").forEach(s=>s.classList.remove("over")); trayEl.classList.remove("over");
  if(!d.ghost){
    if(cancel) return;
    if(d.from.tray){ S.sel=S.sel===d.id?null:d.id; render(S.sel!==null?`<b>${CARDS[d.id].t}</b> 카드를 골랐어요. 빈칸을 눌러 놓으세요.`:PLACE_MSG); }
    else if(S.sel!==null){ put(S.sel,{tray:true},d.from.slot); S.sel=null; render(PLACE_MSG); }
    else { back(d.from.slot); render(PLACE_MSG); }
    return;
  }
  d.ghost.remove();
  const t=cancel?null:document.elementFromPoint(e.clientX,e.clientY);
  const s=t&&t.closest(".slot");
  if(s) put(d.id,d.from,+s.dataset.slot);
  else if(t&&t.closest("#tray")&&d.from.slot!==undefined) back(d.from.slot);
  render(PLACE_MSG);
}
function put(id,from,to){
  const occ=S.slots[to];
  if(from.slot!==undefined){ if(from.slot===to) return; S.slots[from.slot]=occ; S.slots[to]=id; }
  else{ S.tray=S.tray.filter(x=>x!==id); if(occ!==null) S.tray.push(occ); S.slots[to]=id; S.tray.sort((a,b)=>a-b); }
  S.sel=null; blip(520,.06);
}
function back(i){ const id=S.slots[i]; if(id===null) return; S.slots[i]=null; S.tray.push(id); S.tray.sort((a,b)=>a-b); }
function autoScroll(y){ const h=innerHeight,edge=60; let v=0; if(y<edge) v=-(edge-y)/4; else if(y>h-edge) v=(y-(h-edge))/4; if(v) scrollBy(0,v); }

goBtn.addEventListener("click",()=>{
  if(S.slots.some(v=>v===null)) return;
  S.phase="remove"; S.sel=null; blip(660,.1); render(BASE_MSG);
  document.getElementById("board").scrollIntoView({behavior:"smooth",block:"start"});
});

/* ---------- slot taps ---------- */
lineEl.addEventListener("click",e=>{
  const s=e.target.closest(".slot"); if(!s) return;
  const i=+s.dataset.slot, id=S.slots[i];
  if(S.phase==="place"){ if(id===null&&S.sel!==null){ put(S.sel,{tray:true},i); render(PLACE_MSG); } return; }
  if(S.phase!=="remove"||id===null||busy) return;
  const [f,b]=ends();
  if(i!==f && i!==b){
    s.classList.remove("shake"); void s.offsetWidth; s.classList.add("shake"); buzz();
    msgEl.innerHTML=`<span class="red">아직 뗄 수 없어요!</span> ${CARDS[id].t} 카드는 가운데에 있어요.<br>바깥 카드가 먼저 빠져야 해요.`;
    return;
  }
  busy=true;
  const r=s.getBoundingClientRect(), card=s.querySelector(".card");
  card.classList.add("burst"); const tg=s.querySelector(".tag"); if(tg) tg.remove();
  boing(); pop(r.left+r.width/2, r.top+r.height/2, CARDS[id].c);
  setTimeout(()=>{
    busy=false; S.slots[i]=null; S.removed.push(id);
    if(S.slots.every(v=>v===null)){ S.phase="done"; render(); finale(); return; }
    render(BASE_MSG);
  },420);
});
lineEl.addEventListener("keydown",e=>{ if((e.key==="Enter"||e.key===" ")&&e.target.closest(".card")){ e.preventDefault(); e.target.closest(".slot").click(); }});
gridEl.addEventListener("keydown",e=>{ const c=e.target.closest(".card"); if(c&&(e.key==="Enter"||e.key===" ")){ e.preventDefault(); S.sel=+c.dataset.id; render(`<b>${CARDS[S.sel].t}</b> 카드를 골랐어요. 빈칸을 눌러 놓으세요.`); }});

function finale(){
  const v=document.createElement("div"); v.className="veil finale";
  v.innerHTML=`<h3>🎉 모두 해냈어요! 🎉</h3><p>줄에 있던 위험 신호 카드를 모두 뺐어요</p><div class="fgrid">${S.removed.map((id,k)=>cardHTML(CARDS[id]).replace('class="card"',`class="card" style="animation-delay:${.25+k*.12}s;--c:${CARDS[id].c}"`)).join("")}</div><div class="actions"><button class="primary" id="again">다시 하기</button><button id="closeF">카드 보기</button></div>`;
  document.body.appendChild(v);
  v.querySelector("#again").onclick=()=>{ v.remove(); stopFx(); S=fresh(); render(PLACE_MSG); };
  v.querySelector("#closeF").onclick=()=>{ v.remove(); };
  fanfare(); confetti();
  msgEl.innerHTML=`<b>게임 끝!</b> 카드를 모두 뺐어요. 다시 하려면 ‘처음부터’를 누르세요.`;
  S.removed.forEach((_,k)=>setTimeout(()=>blip(700+k*40,.05),250+k*120));
}

/* ---------- sound ---------- */
let AC=null;
function ac(){ if(!soundOn) return null; try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==="suspended") AC.resume(); }catch(e){ return null; } return AC; }
function tone(f,t0,dur,type="triangle",vol=.18){
  const a=ac(); if(!a) return; const o=a.createOscillator(), g=a.createGain();
  o.type=type; o.frequency.value=f; o.connect(g); g.connect(a.destination);
  const s=a.currentTime+t0; g.gain.setValueAtTime(0,s); g.gain.linearRampToValueAtTime(vol,s+.02); g.gain.exponentialRampToValueAtTime(.001,s+dur);
  o.start(s); o.stop(s+dur+.05);
}
function blip(f,d){ tone(f,0,d+.08,"sine",.12); }
function buzz(){ tone(180,0,.18,"square",.07); tone(150,.1,.2,"square",.07); }
function boing(){ const a=ac(); if(!a) return; const o=a.createOscillator(),g=a.createGain(); o.type="sine";
  const s=a.currentTime; o.frequency.setValueAtTime(300,s); o.frequency.exponentialRampToValueAtTime(1100,s+.18);
  g.gain.setValueAtTime(.2,s); g.gain.exponentialRampToValueAtTime(.001,s+.3); o.connect(g); g.connect(a.destination); o.start(s); o.stop(s+.32); }
function fanfare(){
  const n=[[523,0,.16],[523,.17,.16],[523,.34,.16],[659,.52,.5],[587,1.05,.16],[659,1.22,.16],[784,1.4,.9]];
  n.forEach(([f,t,d])=>{ tone(f,t,d+.1,"sawtooth",.08); tone(f*2,t,d,"triangle",.06); });
  [[262,1.4],[330,1.4],[392,1.4]].forEach(([f,t])=>tone(f,t,1,"triangle",.07));
}
$("#sound").onclick=e=>{ soundOn=!soundOn; e.currentTarget.textContent=soundOn?"🔊 소리":"🔇 소리"; e.currentTarget.setAttribute("aria-pressed",soundOn);
  try{ localStorage.setItem("rs-sound",soundOn?"on":"off"); }catch(err){} };
$("#sound").textContent=soundOn?"🔊 소리":"🔇 소리";
$("#reset").onclick=()=>{ document.querySelectorAll(".veil").forEach(v=>v.remove()); stopFx(); S=fresh(); render(PLACE_MSG); };

/* ---------- confetti ---------- */
const cv=$("#fx"), cx=cv.getContext("2d"); let parts=[], raf=null;
function sizeC(){ const r=devicePixelRatio||1; cv.width=innerWidth*r; cv.height=innerHeight*r; cx.setTransform(r,0,0,r,0,0); }
addEventListener("resize",sizeC); sizeC();
function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cols=CARDS.map(c=>c.c).concat(["#f2b632","#ffffff"]);
  const burst=(x,dir)=>{ for(let i=0;i<110;i++){ const a=(-Math.PI/2)+dir*(.25+Math.random()*.55); const sp=9+Math.random()*10;
    parts.push({x,y:innerHeight,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,w:6+Math.random()*7,h:4+Math.random()*5,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[i%cols.length],life:0}); } };
  burst(0,1); burst(innerWidth,-1);
  setTimeout(()=>{ burst(innerWidth*.25,.3); burst(innerWidth*.75,-.3); },700);
  setTimeout(()=>{ burst(0,1); burst(innerWidth,-1); },1400);
  if(!raf) loop();
}
function loop(){
  cx.clearRect(0,0,innerWidth,innerHeight);
  parts.forEach(p=>{ p.vy+=.28; p.vx*=.99; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; p.life++;
    cx.save(); cx.translate(p.x,p.y); cx.rotate(p.r); cx.fillStyle=p.c; cx.fillRect(-p.w/2,-p.h/2,p.w,p.h*Math.abs(Math.cos(p.life*.15))+1); cx.restore(); });
  parts=parts.filter(p=>p.y<innerHeight+40);
  raf=parts.length?requestAnimationFrame(loop):(cx.clearRect(0,0,innerWidth,innerHeight),null);
}
function pop(x,y,col){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cols=[col,"#f2b632","#ffffff",col];
  for(let i=0;i<46;i++){ const a=Math.random()*Math.PI*2, sp=3+Math.random()*7;
    parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-2,w:5+Math.random()*6,h:4+Math.random()*4,r:Math.random()*6,vr:(Math.random()-.5)*.5,c:cols[i%4],life:0}); }
  if(!raf) loop();
}
function stopFx(){ parts=[]; }

S=fresh(); render(PLACE_MSG);
</script>

</body>
</html>
